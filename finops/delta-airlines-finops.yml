specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Delta Airlines
providerId: delta-airlines
publisherName: Delta Air Lines, Inc.
serviceCategory: Travel / Airline Distribution
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: Delta does not publish API pricing or usage telemetry; FinOps shape is inferred from NDC distribution
  norms (per-shop / per-book transaction fees, GDS pass-throughs, partner agreements). Reconcile when
  partner contract terms become available.
tags:
  - Air Travel
  - Airlines
  - NDC
  - Travel
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for Delta Airlines APIs (scaffold). Distribution APIs typically follow
  per-shop and per-book transaction economics under negotiated NDC / partner agreements. No public per-call
  price exists.'
sources:
  - https://developer.delta.com/
principles:
  - name: Visibility
    description: Track Delta NDC API consumption (shopping, pricing, booking, ticketing, ancillary) per
      partner integration; reconcile shop-to-look ratios, look-to-book ratios, and per-PNR cost via partner
      reporting feeds.
  - name: Allocation
    description: Allocate distribution costs by point-of-sale, channel, and brand; tag every API transaction
      to the originating retailing platform or call center.
  - name: Optimization
    description: Apply NDC offer-management caching, repricing rules, and look-to-book guardrails; reduce
      excess shopping volume that drives partner-fee ladders.
  - name: Accountability
    description: Distribution leaders own per-channel API economics; route NDC SLA breaches and shop-volume
      anomalies to the contract owner.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Rate Optimization
      - Workload Optimization
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
      - Onboarding Workloads
billingModel:
  pricingCategory: Negotiated Partner Agreement
  billingFrequency: Per-Contract
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Delta API Suite
  ServiceCategory: Travel / Airline Distribution
  ProviderName: Delta Airlines
  PublisherName: Delta Air Lines, Inc.
  InvoiceIssuerName: Delta Air Lines, Inc.
  PricingCategory: Negotiated
  PricingUnit: transaction
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: shop_requests
    description: NDC shopping / availability / fare-search calls
    unit: request
    aggregation: sum
    dimensions:
      - partner
      - channel
      - market
  - name: bookings
    description: NDC orders / PNRs created
    unit: transaction
    aggregation: sum
    dimensions:
      - partner
      - channel
      - market
  - name: ancillaries_sold
    description: Ancillary services (seats, bags, upgrades) sold via API
    unit: transaction
    aggregation: sum
    dimensions:
      - partner
      - product
apis:
  - name: Delta API Suite
    baseURL: https://developer.delta.com/
    tags:
      - Flights
      - NDC
      - Offers
      - Orders
      - Travel
    serviceName: Delta API Suite
    serviceCategory: API
unitEconomics:
  - name: Cost per Booking
    metric: distribution_cost / bookings
    target: TBD
  - name: Look-to-Book Ratio
    metric: shop_requests / bookings
    target: TBD
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
