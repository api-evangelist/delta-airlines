notes: Delta Airlines does not publish a public API pricing page. Their NDC, offers, orders, and ancillary
  APIs are accessed via partner / corporate channel agreements (NDC distribution, GDS, Delta Edge, Delta
  Pro Tools) under bilateral commercial terms. No public per-call price exists; left as scaffold.
tags:
  - Air Travel
  - Airlines
  - Aviation
  - Booking
  - Flights
  - NDC
  - Travel
description: No public API pricing is published. Delta's NDC and Delta Pro Tools APIs are gated to corporate
  travel agencies, GDS partners, and accredited NDC partners and are commercially negotiated rather than
  self-serve. Custom pricing terms are described in partner agreements; this artifact retains a single
  enterprise-style plan stub pending direct partner reconciliation.
sources:
