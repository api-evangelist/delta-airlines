}

type Cancellation {
  reason: String
  rebookingOptions: [Flight!]
  refundEligible: Boolean!
}

type Diversion {
  diversionAirport: Airport!
  reason: String
  estimatedResumption: DateTime
}

type FlightStatus {
  code: FlightStatusCode!
  description: String!
  updatedAt: DateTime!
  delay: Delay
  cancellation: Cancellation
  diversion: Diversion
}

type FlightDetails {
  flightNumber: FlightNumber!
  date: Date!
  aircraft: AircraftInfo!
  departure: Departure!
  arrival: Arrival!
  duration: Int!
  distance: Int!
  cabinsOffered: [CabinClass!]!
  codeshares: [Codeshare!]
  wifi: WiFi
  mealService: MealService
  inFlightEntertainment: InFlightEntertainment
}

type Flight {
  id: ID!
  flightNumber: FlightNumber!
  date: Date!
  status: FlightStatus!
  details: FlightDetails!
  seatMap: SeatMap
}

