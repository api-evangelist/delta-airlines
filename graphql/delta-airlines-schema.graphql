# ─── API Access ───────────────────────────────────────────────────────────────

type APIKey {
  keyId: ID!
  name: String!
  createdAt: DateTime!
  expiresAt: DateTime
  scopes: [String!]!
  isActive: Boolean!
}

type Token {
  accessToken: String!
  tokenType: String!
  expiresIn: Int!
  scope: String!
  issuedAt: DateTime!
}

# ─── Input Types ──────────────────────────────────────────────────────────────

input FlightSearchInput {
  origin: IATA!
  destination: IATA!
  departureDate: Date!
  returnDate: Date
  passengerCount: Int!
  cabinClass: CabinClass
  nonstopOnly: Boolean
  maxConnections: Int
}

input BookingInput {
  itineraryId: ID!
  fareId: ID!
  passengers: [PassengerInput!]!
  paymentMethod: String
  milesRedemption: Int
}

input PassengerInput {
  firstName: String!
  lastName: String!
  dateOfBirth: Date
  gender: String
  passportNumber: String
  passportExpiry: Date
  knownTravelerNumber: String
  skyMilesNumber: String
  contactEmail: String!
  contactPhone: String
}

input SeatSelectionInput {
  pnr: String!
  passengerId: ID!
  seatNumber: String!
  flightSegment: String!
}

input CheckinInput {
  pnr: String!
  lastName: String!
  passengerId: ID
}

input SpecialServiceRequestInput {
  pnr: String!
  passengerId: ID!
  ssrCode: SSRCode!
  flightSegment: String
  notes: String
}

# ─── Queries ──────────────────────────────────────────────────────────────────

type Query {
  """Retrieve current flight status and details by flight number and date."""
  flight(flightNumber: String!, date: Date!): Flight

  """Search for available flights between two airports on a given date."""
  flightSearch(input: FlightSearchInput!): [Itinerary!]!

  """Retrieve a reservation by PNR record locator and passenger last name."""
  itinerary(pnr: String!, lastName: String!): Reservation

  """Retrieve the seat map for a specific flight."""
  seatMap(flightNumber: String!, date: Date!, cabinClass: CabinClass): SeatMap

  """Retrieve SkyMiles account details for a member."""
  skyMilesAccount(memberId: ID!): SkyMilesAccount

  """Retrieve airport information by IATA code."""
  airport(code: IATA!): Airport

  """List SkyClub locations at an airport."""
  skyClubs(airportCode: IATA!): [SkyClub!]!

  """Retrieve baggage allowance for a cabin class and Medallion tier."""
  baggageAllowance(cabinClass: CabinClass!, medallionTier: MedallionTier): BaggageAllowance

  """Retrieve flight schedule between two airports."""
  flightSchedule(origin: IATA!, destination: IATA!, date: Date): [FlightSchedule!]!

  """Retrieve a boarding pass for a checked-in passenger."""
  boardingPass(pnr: String!, passengerId: ID!): BoardingPass

  """Track a checked bag by tag number."""
  bagStatus(tagNumber: String!): BagTag

  """Retrieve upgrade certificate details."""
  upgradeCertificate(certificateId: ID!): UpgradeCertificate

  """List SkyTeam member airlines."""
  skyTeamMembers: [Partner!]!
}

# ─── Mutations ────────────────────────────────────────────────────────────────

type Mutation {
  """Create a new flight booking."""
  createBooking(input: BookingInput!): Booking

  """Cancel an existing booking by PNR."""
  cancelBooking(pnr: String!, reason: String): Booking

  """Select or change a seat assignment."""
  selectSeat(input: SeatSelectionInput!): Seat

  """Initiate check-in for one or more passengers."""
  checkin(input: CheckinInput!): [Checkin!]!

  """Redeem SkyMiles toward a booking."""
  redeemMiles(memberId: ID!, bookingInput: BookingInput!): MilesRedemption

  """Add a special service request to a booking."""
  addSpecialServiceRequest(input: SpecialServiceRequestInput!): SpecialServiceRequest

  """Request an upgrade for a passenger."""
  requestUpgrade(pnr: String!, passengerId: ID!, targetCabin: CabinClass!): Upgrade

  """Apply an upgrade certificate to a booking."""
  applyUpgradeCertificate(certificateId: ID!, pnr: String!, passengerId: ID!): Upgrade

  """Add a companion to a SkyMiles account."""
  addCompanion(memberId: ID!, companionMemberId: ID!): Companion
}

# ─── Subscriptions ────────────────────────────────────────────────────────────

type Subscription {
  """Subscribe to real-time flight status updates."""
  flightStatusUpdated(flightNumber: String!, date: Date!): FlightStatus

  """Subscribe to upgrade clearance notifications."""
  upgradeCleared(pnr: String!, passengerId: ID!): Upgrade

  """Subscribe to gate change notifications for a flight."""
  gateChanged(flightNumber: String!, date: Date!): Gate
}
