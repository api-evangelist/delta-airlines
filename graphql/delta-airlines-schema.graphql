# ─── Flight ───────────────────────────────────────────────────────────────────

type FlightNumber {
  carrier: String!
  number: String!
  full: String!
}

type FlightSchedule {
  id: ID!
  flightNumber: FlightNumber!
  origin: Airport!
  destination: Airport!
  scheduledDeparture: DateTime!
  scheduledArrival: DateTime!
  operatingDays: [String!]!
  effectiveFrom: Date!
  effectiveTo: Date!
  aircraft: AircraftInfo
  codeshares: [Codeshare!]
}

type Departure {
  airport: Airport!
  terminal: Terminal
  gate: Gate
  scheduledTime: DateTime!
  estimatedTime: DateTime
  actualTime: DateTime
  baggageClaimBelt: String
}

type Arrival {
  airport: Airport!
  terminal: Terminal
  gate: Gate
  scheduledTime: DateTime!
  estimatedTime: DateTime
  actualTime: DateTime
  baggageClaimBelt: String
}

type Delay {
  delayMinutes: Int!
  reason: String
