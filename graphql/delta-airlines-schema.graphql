"""
Delta Airlines GraphQL Schema
Conceptual schema representing the Delta Air Lines flight and travel API domain.
Based on publicly known Delta products, NDC standards, and the Delta developer portal.
Access requires partner approval at https://apiportal.delta.com
"""

# ─── Scalars ──────────────────────────────────────────────────────────────────

scalar DateTime
scalar Date
scalar Time
scalar Currency
scalar IATA   # 3-letter airport code
scalar ICAO   # 4-letter airport code
scalar URL

# ─── Enums ────────────────────────────────────────────────────────────────────

enum CabinClass {
  BASIC_ECONOMY
  MAIN_CABIN
  COMFORT_PLUS
  FIRST_CLASS
  DELTA_ONE
  DELTA_ONE_SUITE
}

enum FlightStatusCode {
  SCHEDULED
  DELAYED
  ON_TIME
  DEPARTED
  IN_FLIGHT
  LANDED
  ARRIVED
  CANCELLED
  DIVERTED
}

enum MedallionTier {
  NONE
  SILVER
  GOLD
  PLATINUM
  DIAMOND
}

enum SeatLocation {
  WINDOW
  MIDDLE
  AISLE
}

enum BaggageStatus {
  CHECKED_IN
  IN_TRANSIT
  ARRIVED
  DELAYED
  LOST
}

enum SSRCode {
  WCHR   # Wheelchair ramp
  WCHS   # Wheelchair steps
  WCHC   # Wheelchair carried
  BLND   # Blind passenger
  DEAF   # Deaf/hearing impaired
  UMNR   # Unaccompanied minor
  PETC   # Pet in cabin
  SPEQ   # Sports equipment
  VGML   # Vegetarian meal
  KSML   # Kosher meal
  HNML   # Hindu meal
  MOML   # Muslim meal
  DBML   # Diabetic meal
  LCML   # Low-calorie meal
}

enum TicketStatus {
  OPEN
  USED
  VOID
  REFUNDED
  EXCHANGED
}

enum BookingStatus {
  CONFIRMED
  PENDING
  CANCELLED
  WAITLISTED
  ON_REQUEST
}

enum PartnerType {
  CODESHARE
  INTERLINE
  SKYTEAM
  ALLIANCE
}

# ─── Airport & Network ────────────────────────────────────────────────────────

type Airport {
  id: ID!
  iataCode: IATA!
  icaoCode: ICAO
  name: String!
  city: String!
  country: String!
  countryCode: String!
  timezone: String!
  terminals: [Terminal!]
  isHub: Boolean!
  hubInfo: Hub
  skyClubs: [SkyClub!]
  coordinates: Coordinates
}

type Coordinates {
  latitude: Float!
  longitude: Float!
}

type Terminal {
  id: ID!
  name: String!
  code: String
  airport: Airport!
  gates: [Gate!]
}

type Gate {
  id: ID!
  gateNumber: String!
  terminal: Terminal!
  concourse: String
}

type Hub {
  airport: Airport!
  isInternationalHub: Boolean!
  primaryCodes: [IATA!]
}

type SkyClub {
  id: ID!
  name: String!
  terminal: Terminal!
  airport: Airport!
  openingHours: String
  amenities: [String!]
  accessRequirements: String
}

# ─── Partner & Alliance ───────────────────────────────────────────────────────

type Partner {
  id: ID!
  name: String!
  iataCode: String
  partnerType: PartnerType!
  isSkyTeamMember: Boolean!
  skyTeam: SkyTeam
  milesEarningRatio: Float
}

type SkyTeam {
  memberAirlines: [Partner!]!
  elitePlusRecognized: Boolean!
  loungeAccess: Boolean!
}

type Codeshare {
  operatingCarrier: Partner!
  marketingCarrier: Partner!
  operatingFlightNumber: String!
  marketingFlightNumber: String!
}

# ─── Aircraft ─────────────────────────────────────────────────────────────────

type AircraftInfo {
  id: ID!
  iataCode: String!
  icaoCode: String
  name: String!
  manufacturer: String!
  totalSeats: Int!
  cabins: [CabinInfo!]!
  hasWifi: Boolean!
  hasPowerOutlets: Boolean!
  hasInFlightEntertainment: Boolean!
  tailNumber: String
}

type CabinInfo {
  cabinClass: CabinClass!
  seatCount: Int!
  seatConfiguration: String
  hasFlatBed: Boolean!
  hasDirectAisleAccess: Boolean!
}

# ─── Seat & Seat Map ──────────────────────────────────────────────────────────

type SeatMap {
  flightNumber: String!
  date: Date!
  aircraft: AircraftInfo!
  cabins: [CabinSeatMap!]!
}

type CabinSeatMap {
  cabinClass: CabinClass!
  rows: [SeatRow!]!
}

type SeatRow {
  rowNumber: Int!
  seats: [Seat!]!
}

type Seat {
  id: ID!
  seatNumber: String!
  row: Int!
  location: SeatLocation!
  cabinClass: CabinClass!
  availability: SeatAvailability!
  isExitRow: Boolean!
  isExtraLegroom: Boolean!
  isPreferredSeat: Boolean!
  isBlockedForElite: Boolean!
  upgradeCost: Float
  currency: Currency
}

type SeatAvailability {
  isAvailable: Boolean!
  isOccupied: Boolean!
  isReservedForElite: Boolean!
  eligibleCabinClasses: [CabinClass!]!
}

