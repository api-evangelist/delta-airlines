specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Delta Airlines
providerId: delta-airlines
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: No public Delta Airlines rate-limit documentation. NDC and partner APIs are accessed under contract
  with negotiated TPS and quotas; published numbers are not available. Headers and response codes are
  scaffold defaults pending partner-doc reconciliation.
tags:
  - Air Travel
  - Airlines
  - Aviation
  - NDC
  - Travel
  - Rate Limiting
description: Delta Airlines does not publish API rate limits. NDC and Delta Pro Tools APIs are accessed
  under partner agreements that specify per-partner TPS, daily, and monthly quotas. Operational limits
  are defined per integration and not in public docs.
sources:
  - https://developer.delta.com/
responseCodes:
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
  - tier: partner
    name: Partner Negotiated Limit
    scope: contract
    metric: varies
    limit: 'negotiated per partner agreement'
    applies:
      - Delta API Suite
policies:
  - name: Partner-Negotiated Throttling
    description: Each NDC / partner agreement defines its own TPS and burst ceiling; no public defaults
      exist. Implement exponential backoff on 429 / 503.
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter, honoring Retry-After when present.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
